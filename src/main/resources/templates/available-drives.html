<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PlacePro - Available Placement Drives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-rocket-takeoff-fill text-warning me-2"></i>Available Placement Drives</h2>
                    <p class="text-muted mb-0">Check company eligibility criteria and apply directly.</p>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="row g-4">
                <div th:each="drive : ${drives}" class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h4 class="fw-bold text-dark mb-0" th:text="${drive.company.name}">Company Name</h4>
                                    <div class="text-primary fw-semibold" th:text="${drive.jobRole}">Job Role</div>
                                </div>
                                <span class="badge bg-success fs-6" th:text="${'₹ ' + drive.company.packageOffered + ' LPA'}">12 LPA</span>
                            </div>

                            <p class="small text-muted mb-3" th:text="${drive.company.industry + ' • ' + drive.company.location}">Location</p>

                            <div class="p-3 bg-light rounded-3 mb-3">
                                <div class="row g-2 small text-secondary">
                                    <div class="col-6"><strong>Drive Date:</strong> <span th:text="${drive.driveDate}">Date</span></div>
                                    <div class="col-6"><strong>Deadline:</strong> <span class="text-danger fw-bold" th:text="${drive.applicationDeadline}">Deadline</span></div>
                                    <div class="col-6"><strong>Min CGPA:</strong> <span th:text="${drive.company.minimumCgpa}">7.5</span></div>
                                    <div class="col-6"><strong>Max Arrears:</strong> <span th:text="${drive.company.maximumArrears}">0</span></div>
                                </div>
                            </div>

                            <!-- DYNAMIC ELIGIBILITY CHECK -->
                            <div th:with="eval=${eligibilityMap.get(drive.id)}">
                                <div th:if="${eval.eligible}" class="alert alert-success p-2 mb-3 small d-flex align-items-center gap-2">
                                    <i class="bi bi-check-circle-fill fs-5"></i>
                                    <span><strong>ELIGIBLE:</strong> You meet all criteria for this drive.</span>
                                </div>
                                <div th:if="${!eval.eligible}" class="alert alert-danger p-2 mb-3 small">
                                    <div class="fw-bold mb-1"><i class="bi bi-x-circle-fill me-1"></i> NOT ELIGIBLE</div>
                                    <ul class="mb-0 ps-3">
                                        <li th:each="r : ${eval.reasons}" th:text="${r}">Reason</li>
                                    </ul>
                                </div>

                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <span th:if="${appliedDriveIds.contains(drive.id)}" class="badge bg-secondary p-2 fs-6">
                                        <i class="bi bi-check2-circle me-1"></i> Applied
                                    </span>

                                    <form th:if="${!appliedDriveIds.contains(drive.id) and eval.eligible}"
                                          th:action="@{'/student/apply/' + ${drive.id}}" method="post" class="w-100">
                                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold brand-gradient border-0">
                                            <i class="bi bi-send-fill me-1"></i> Apply Now
                                        </button>
                                    </form>

                                    <button th:if="${!appliedDriveIds.contains(drive.id) and !eval.eligible}"
                                            class="btn btn-outline-secondary w-100 rounded-pill fw-bold" disabled>
                                        Ineligible to Apply
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit ? 'Edit Student Record' : 'Add Student Record'}">Student Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <main class="main-content">
            <div class="mb-4">
                <a href="/admin/students" class="btn btn-outline-secondary btn-sm rounded-pill mb-2"><i class="bi bi-arrow-left"></i> Back to Student List</a>
                <h2 class="fw-bold mb-1" th:text="${isEdit ? 'Edit Student Record' : 'Add New Student Record'}">Student Form</h2>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <form th:action="${isEdit ? '/admin/students/' + studentDto.id : '/admin/students'}"
                          th:object="${studentDto}" method="post">

                        <input type="hidden" th:field="*{assignedAdminId}" />

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Registration Number *</label>
                                <input type="text" th:field="*{registrationNumber}" class="form-control" placeholder="e.g. 2024CSE009" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('registrationNumber')}" th:errors="*{registrationNumber}">Error</div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name *</label>
                                <input type="text" th:field="*{name}" class="form-control" placeholder="e.g. Rahul Sharma" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Error</div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address *</label>
                                <input type="email" th:field="*{email}" class="form-control" placeholder="rahul@placepro.edu" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Error</div>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" th:field="*{phone}" class="form-control" placeholder="10-digit mobile number">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Department *</label>
                                <select th:field="*{department}" class="form-select fw-semibold" required>
                                    <option value="">-- Select Department --</option>
                                    <option value="CSE">CSE</option>
                                    <option value="IT">IT</option>
                                    <option value="AIDS">AIDS</option>
                                    <option value="ECE">ECE</option>
                                    <option value="EEE">EEE</option>
                                    <option value="MECH">MECH</option>
                                    <option value="CIVIL">CIVIL</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Graduation Year *</label>
                                <input type="number" th:field="*{graduationYear}" class="form-control" placeholder="2025" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold">CGPA (6.5 - 10.0) *</label>
                                <input type="number" step="0.01" min="6.5" max="10.0" th:field="*{cgpa}" class="form-control" placeholder="6.5 - 10.0" required>
                                <div class="text-danger small" th:if="${#fields.hasErrors('cgpa')}" th:errors="*{cgpa}">Error</div>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Standing Arrears *</label>
                                <input type="number" min="0" th:field="*{arrears}" class="form-control" placeholder="0" required>
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Aptitude Score (0-100)</label>
                                <input type="number" step="0.1" min="0" max="100" th:field="*{aptitudeScore}" class="form-control" placeholder="85.0">
                            </div>

                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Communication Score (0-100)</label>
                                <input type="number" step="0.1" min="0" max="100" th:field="*{communicationScore}" class="form-control" placeholder="88.0">
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Technical Skills (Comma-separated)</label>
                                <textarea th:field="*{skills}" class="form-control" rows="2" placeholder="Java, Spring Boot, SQL, Git"></textarea>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Certifications & Achievements</label>
                                <textarea th:field="*{certifications}" class="form-control" rows="2" placeholder="AWS Certified, NPTEL Certification..."></textarea>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Key Projects</label>
                                <textarea th:field="*{projects}" class="form-control" rows="2" placeholder="E-commerce Web App, AI Chatbot..."></textarea>
                            </div>

                            <div class="col-md-12 mt-4">
                                <button type="submit" class="btn btn-primary px-4 rounded-pill fw-bold brand-gradient border-0">
                                    <i class="bi bi-save me-1"></i> Save Student Record
                                </button>
                                <a href="/admin/students" class="btn btn-outline-secondary px-4 rounded-pill ms-2">Cancel</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

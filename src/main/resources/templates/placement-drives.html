<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Placepro - Placement Drives</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
    <style>
        body {
            position: relative;
            background-color: #1e293b;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('/images/drives-bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            transform: translateZ(0);
            will-change: transform;
        }
        .main-content {
            background: rgba(15, 23, 42, 0.25) !important;
        }
        .glass-card-header {
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4 glass-card-header animate-fade-in-up">
                <div>
                    <h2 class="fw-bold text-white mb-1"><i class="bi bi-calendar-event-fill text-warning me-2"></i>Placement Drives</h2>
                    <p class="text-white opacity-75 mb-0">Schedule drives, set deadlines, and manage student job postings.</p>
                </div>
                <div>
                    <a href="/admin/placement-drives/new" class="btn btn-warning rounded-pill fw-bold shadow-sm border-0 px-4 text-dark">
                        <i class="bi bi-plus-lg me-1"></i> Create Placement Drive
                    </a>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- DRIVES TABLE -->
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden animate-fade-in-up delay-1">
                <div class="table-responsive">
                    <table class="table table-hover table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Company</th>
                                <th>Job Role</th>
                                <th>Drive Date</th>
                                <th>Application Deadline</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="d : ${drives}">
                                <td class="fw-bold text-dark" th:text="${d.company.name}">Company</td>
                                <td th:text="${d.jobRole}">Job Role</td>
                                <td><i class="bi bi-calendar3 me-1 text-primary"></i><span th:text="${d.driveDate}">2026-09-01</span></td>
                                <td><i class="bi bi-clock-history me-1 text-danger"></i><span th:text="${d.applicationDeadline}">2026-08-30</span></td>
                                <td>
                                    <span th:class="${d.status == 'OPEN' ? 'badge bg-success fs-6' : 'badge bg-secondary fs-6'}" th:text="${d.status}">OPEN</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{'/admin/placement-drives/' + ${d.id} + '/edit'}" class="btn btn-outline-warning" title="Edit Drive">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:if="${d.status == 'OPEN'}" th:action="@{'/admin/placement-drives/' + ${d.id} + '/close'}" method="post" class="d-inline">
                                            <button type="submit" class="btn btn-outline-secondary" title="Close Drive">
                                                <i class="bi bi-x-circle"></i> Close
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(drives)}">
                                <td colspan="6" class="text-center py-4 text-muted">No placement drives scheduled yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

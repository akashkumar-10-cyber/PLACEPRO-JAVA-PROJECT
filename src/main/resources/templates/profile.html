<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PlacePro - My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="main-content">
            <div class="mb-4">
                <h2 class="fw-bold mb-1"><i class="bi bi-person-badge-fill text-primary me-2"></i>My Profile</h2>
                <p class="text-muted mb-0">Update your skills, certifications, and academic info for AI evaluation.</p>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <form th:action="@{/student/profile}" th:object="${studentDto}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Registration Number</label>
                                <input type="text" th:field="*{registrationNumber}" class="form-control bg-light" readonly>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Full Name *</label>
                                <input type="text" th:field="*{name}" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Email Address *</label>
                                <input type="email" th:field="*{email}" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Phone Number</label>
                                <input type="text" th:field="*{phone}" class="form-control">
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Department</label>
                                <input type="text" th:field="*{department}" class="form-control bg-light" readonly>
                            </div>

                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Graduation Year</label>
                                <input type="number" th:field="*{graduationYear}" class="form-control bg-light" readonly>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label fw-semibold">CGPA</label>
                                <input type="number" step="0.01" th:field="*{cgpa}" class="form-control bg-light" readonly>
                            </div>

                            <div class="col-md-2">
                                <label class="form-label fw-semibold">Arrears</label>
                                <input type="number" th:field="*{arrears}" class="form-control bg-light" readonly>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Technical Skills (Comma-separated) *</label>
                                <textarea th:field="*{skills}" class="form-control" rows="2" placeholder="Java, Spring Boot, SQL, Git" required></textarea>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Certifications</label>
                                <textarea th:field="*{certifications}" class="form-control" rows="2" placeholder="Oracle Java Certified, AWS Practitioner"></textarea>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Projects</label>
                                <textarea th:field="*{projects}" class="form-control" rows="2" placeholder="E-commerce portal, Smart Attendance app"></textarea>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Aptitude Score (0-100)</label>
                                <input type="number" step="0.1" th:field="*{aptitudeScore}" class="form-control bg-light" readonly>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Communication Score (0-100)</label>
                                <input type="number" step="0.1" th:field="*{communicationScore}" class="form-control bg-light" readonly>
                            </div>

                            <div class="col-md-12 mt-4">
                                <button type="submit" class="btn btn-primary px-4 rounded-pill fw-bold brand-gradient border-0">
                                    <i class="bi bi-save me-1"></i> Update Profile
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

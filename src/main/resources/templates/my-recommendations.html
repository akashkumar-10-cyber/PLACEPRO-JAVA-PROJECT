<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PlacePro - AI Recommendations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-stars text-warning me-2"></i>AI Company Recommendations</h2>
                    <p class="text-muted mb-0">Smart matchmaking comparing your profile against participating companies.</p>
                </div>
            </div>

            <div class="row g-4">
                <div th:each="rec : ${recommendations}" class="col-md-6">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <div>
                                    <h4 class="fw-bold text-dark mb-0" th:text="${rec.companyName}">Company Name</h4>
                                    <small class="text-muted" th:text="${rec.industry + ' • ' + rec.location}">Industry</small>
                                </div>
                                <div class="text-end">
                                    <span class="fs-4 fw-bold text-primary" th:text="${rec.matchScore + '%'}">92%</span>
                                    <div class="small text-muted">Match Score</div>
                                </div>
                            </div>

                            <div class="progress mb-3" style="height: 8px;">
                                <div class="progress-bar bg-success" role="progressbar" th:style="'width: ' + ${rec.matchScore} + '%'"></div>
                            </div>

                            <div class="mb-3">
                                <div class="small fw-bold text-muted mb-1">Matched Skills:</div>
                                <span th:each="ms : ${rec.matchedSkills}" class="badge bg-success-subtle text-success border border-success-subtle me-1" th:text="${ms}">Java</span>
                            </div>

                            <div class="mb-3" th:if="${!#lists.isEmpty(rec.missingSkills)}">
                                <div class="small fw-bold text-muted mb-1">Missing Skills:</div>
                                <span th:each="ms : ${rec.missingSkills}" class="badge bg-danger-subtle text-danger border border-danger-subtle me-1" th:text="${ms}">Git</span>
                            </div>

                            <div class="p-3 bg-light rounded-3 border mb-3">
                                <div class="small fw-bold text-dark mb-1"><i class="bi bi-lightbulb-fill text-warning me-1"></i> Recommendation Reason:</div>
                                <p class="small text-secondary mb-0" th:text="${rec.recommendationReason}">Reason...</p>
                            </div>

                            <div class="d-flex justify-content-between align-items-center">
                                <span class="badge ai-badge" th:text="${'Source: ' + rec.source}">Gemini AI</span>
                                <a th:href="@{'/student/skill-gap?companyId=' + ${rec.companyId}}" class="btn btn-outline-primary btn-sm rounded-pill">
                                    Skill Gap Analysis <i class="bi bi-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

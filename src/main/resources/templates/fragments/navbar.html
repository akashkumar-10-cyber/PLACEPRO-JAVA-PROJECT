<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<div th:fragment="navbar">
    <!-- Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark brand-gradient sticky-top shadow-sm py-2">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
            <!-- Left: Placement Portal Menu Pop-up Button -->
            <div class="d-flex align-items-center me-3">
                <button class="btn btn-warning rounded-pill fw-bold px-3 py-2 shadow-sm d-inline-flex align-items-center gap-2 border-0"
                        type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
                    <i class="bi bi-list fs-5"></i>
                    <span class="text-nowrap">Placement Portal Menu</span>
                </button>
            </div>

            <!-- Top Center: Placepro Crimson Logo & System Title -->
            <div class="text-center mx-auto px-2">
                <a class="navbar-brand d-inline-flex align-items-center gap-2 fw-bold m-0 text-decoration-none" href="/admin/dashboard">
                    <div class="bg-white bg-opacity-95 p-1 px-2 rounded-3 shadow-sm d-inline-flex align-items-center">
                        <img th:src="@{/images/placepro-logo.png}" alt="Placepro Logo" style="height: 38px; width: auto; max-height: 38px;">
                    </div>
                    <span class="fs-5 fw-bold text-white text-nowrap">Placepro - Smart Placement Management System</span>
                </a>
            </div>

            <!-- Right: Integrated User Profile Dropdown with Logout Inside -->
            <div class="d-flex align-items-center ms-3">
                <div class="dropdown" sec:authorize="isAuthenticated()">
                    <button class="btn btn-outline-light rounded-pill px-3 py-1 d-flex align-items-center gap-2 dropdown-toggle shadow-sm"
                            type="button" id="userMenuDropdown" data-bs-toggle="dropdown" aria-expanded="false" style="border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.1);">
                        <div class="d-flex align-items-center justify-content-center bg-warning text-dark rounded-circle fw-bold shadow-sm" style="width: 28px; height: 28px; font-size: 0.85rem;">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <span class="fw-semibold text-white me-1" sec:authentication="name">admin1</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 mt-2 py-2" aria-labelledby="userMenuDropdown" style="min-width: 180px;">
                        <li class="px-3 py-2 border-bottom bg-light">
                            <div class="small text-muted" style="font-size: 0.75rem;">Logged in as</div>
                            <div class="fw-bold text-dark" sec:authentication="name">admin1</div>
                            <div class="badge bg-primary mt-1" style="font-size: 0.65rem;">Placement Cell Officer</div>
                        </li>
                        <li class="pt-1">
                            <form th:action="@{/logout}" method="post" class="m-0 p-0">
                                <button type="submit" class="dropdown-item text-danger d-flex align-items-center gap-2 py-2 fw-semibold">
                                    <i class="bi bi-box-arrow-right"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <!-- Offcanvas Pop-up Drawer Menu Fragment -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
</div>
</html>

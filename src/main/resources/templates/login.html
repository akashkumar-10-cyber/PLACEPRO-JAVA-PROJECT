<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placepro - Smart Placement Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #090d16 url('/images/login-bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        .login-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.4) 0%, rgba(9, 13, 22, 0.88) 100%);
            z-index: 1;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
        }

        /* POP ANIMATIONS */
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.65) translateY(40px); }
            70% { opacity: 1; transform: scale(1.05) translateY(-6px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .pop-header {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .pop-card {
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.12s forwards;
            opacity: 0;
        }

        .pop-input-1 {
            animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.22s forwards;
            opacity: 0;
        }

        .pop-input-2 {
            animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s forwards;
            opacity: 0;
        }

        .pop-btn {
            animation: popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.38s forwards;
            opacity: 0;
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.92) !important;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 158, 11, 0.45) !important;
            border-radius: 24px !important;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 158, 11, 0.2) !important;
        }

        /* HIGH-CONTRAST VISIBLE INPUT FIELDS */
        .form-control-dark {
            background: rgba(15, 23, 42, 0.95) !important;
            border: 1px solid rgba(245, 158, 11, 0.5) !important;
            color: #ffffff !important;
            font-size: 1rem !important;
            font-weight: 600 !important;
            border-radius: 0 14px 14px 0 !important;
            padding: 0.85rem 1.1rem !important;
            transition: all 0.2s ease !important;
        }

        .form-control-dark::placeholder {
            color: rgba(255, 255, 255, 0.75) !important;
            font-weight: 500 !important;
        }

        .form-control-dark:focus {
            background: #0f172a !important;
            border-color: #f59e0b !important;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4) !important;
        }

        .input-group-text-dark {
            background: rgba(30, 41, 59, 0.95) !important;
            border: 1px solid rgba(245, 158, 11, 0.5) !important;
            color: #f59e0b !important;
            font-size: 1.2rem !important;
            border-radius: 14px 0 0 14px !important;
            padding-left: 1.1rem !important;
            padding-right: 1.1rem !important;
        }

        .btn-glow {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%) !important;
            border: none !important;
            color: #0f172a !important;
            font-size: 1.05rem !important;
            font-weight: 800 !important;
            padding: 0.9rem !important;
            border-radius: 50px !important;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4) !important;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease !important;
        }

        .btn-glow:hover {
            transform: scale(1.03) translateY(-2px) !important;
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6) !important;
            color: #000000 !important;
        }
    </style>
</head>
<body>
    <div class="login-overlay"></div>

    <div class="login-wrapper">
        <!-- Custom Crimson PlacePro Logo Header (Pop Anim) -->
        <div class="text-center mb-3 pop-header">
            <div class="bg-white bg-opacity-95 p-2 px-3 rounded-4 d-inline-block shadow-lg border border-light">
                <img th:src="@{/images/placepro-logo.png}" alt="Placepro Logo" style="max-height: 95px; width: auto;" class="img-fluid">
            </div>
        </div>

        <!-- Animated Glassmorphism Pop Login Card -->
        <div class="card glass-card pop-card border-0">
            <div class="card-body p-4 p-sm-4">

                <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show small bg-danger bg-opacity-20 border-danger text-white mb-3" role="alert">
                    <i class="bi bi-exclamation-triangle-fill me-2 text-warning"></i>Invalid username or password.
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show small bg-success bg-opacity-20 border-success text-white mb-3" role="alert">
                    <i class="bi bi-check-circle-fill me-2"></i>You have been logged out successfully.
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                </div>

                <form th:action="@{/login}" method="post">
                    <!-- Username Input with High Contrast Placeholder & Pop Anim -->
                    <div class="mb-3 pop-input-1">
                        <label for="username" class="form-label text-warning fw-bold small"><i class="bi bi-person-fill me-1"></i> Username</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-dark"><i class="bi bi-person-circle"></i></span>
                            <input type="text" id="username" name="username" class="form-control form-control-dark" placeholder="Enter username" required autocomplete="username">
                        </div>
                    </div>

                    <!-- Password Input with High Contrast Placeholder & Pop Anim -->
                    <div class="mb-4 pop-input-2">
                        <label for="password" class="form-label text-warning fw-bold small"><i class="bi bi-lock-fill me-1"></i> Password</label>
                        <div class="input-group">
                            <span class="input-group-text input-group-text-dark"><i class="bi bi-key-fill"></i></span>
                            <input type="password" id="password" name="password" class="form-control form-control-dark" placeholder="Enter password" required autocomplete="current-password">
                        </div>
                    </div>

                    <!-- Submit Button with Pop Anim -->
                    <div class="d-grid mb-2 pop-btn">
                        <button type="submit" class="btn btn-glow">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In to Placement Portal
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Placepro - Company Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
    <style>
        body {
            position: relative;
            background-color: #0f172a;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('/images/company-bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            transform: translateZ(0);
            will-change: transform;
        }
        .main-content {
            background: rgba(15, 23, 42, 0.15) !important;
        }
        .glass-card-header {
            background: rgba(15, 23, 42, 0.65) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            color: #ffffff !important;
        }
        .glass-card-header h2, .glass-card-header p {
            color: #ffffff !important;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4 glass-card-header animate-fade-in-up">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-building text-warning me-2"></i>Company Management</h2>
                    <p class="text-white opacity-75 mb-0">Add companies, define criteria, and manage placement partners.</p>
                </div>
                <div>
                    <a href="/admin/companies/new" class="btn btn-warning rounded-pill fw-bold shadow-sm border-0 px-4 py-2 text-dark">
                        <i class="bi bi-plus-lg me-1"></i> Add Company
                    </a>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- SEARCH -->
            <div class="card border-0 shadow-lg rounded-4 mb-4 animate-fade-in-up delay-1">
                <div class="card-body p-3">
                    <form th:action="@{/admin/companies}" method="get" class="row g-2">
                        <div class="col-md-9">
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                                <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Search Company Name, Industry, or Skills...">
                            </div>
                        </div>
                        <div class="col-md-3 d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100 fw-bold brand-gradient border-0">Search</button>
                            <a href="/admin/companies" class="btn btn-outline-secondary" title="Reset"><i class="bi bi-arrow-counterclockwise"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- COMPANIES TABLE -->
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden animate-fade-in-up delay-2">
                <div class="table-responsive">
                    <table class="table table-hover table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Company Name</th>
                                <th>Industry</th>
                                <th>Location</th>
                                <th>Min CGPA</th>
                                <th>Package Offered</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="c : ${companies}">
                                <td class="fw-bold text-dark" th:text="${c.name}">Zoho</td>
                                <td><span class="badge bg-light text-dark border" th:text="${c.industry}">Software</span></td>
                                <td th:text="${c.location}">Chennai</td>
                                <td><span class="badge bg-primary fs-6" th:text="${c.minimumCgpa}">7.0</span></td>
                                <td>
                                    <span class="badge bg-success bg-opacity-10 text-success border border-success fw-bold px-3 py-2" th:text="${c.packageOffered}">7.0 - 12.5 LPA</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{'/admin/companies/' + ${c.id}}" class="btn btn-outline-info" title="View Details">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{'/admin/companies/' + ${c.id} + '/edit'}" class="btn btn-outline-warning" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{'/admin/companies/' + ${c.id} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('Delete company record?');">
                                            <button type="submit" class="btn btn-outline-danger" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(companies)}">
                                <td colspan="6" class="text-center py-4 text-muted">No companies registered yet matching your criteria.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

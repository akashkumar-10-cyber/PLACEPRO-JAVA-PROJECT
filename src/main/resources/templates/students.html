<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Placepro - Faculty Student Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
    <style>
        body {
            position: relative;
            background-color: #05070c;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('/images/student-bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            transform: translateZ(0);
            will-change: transform;
        }
        .main-content {
            background: transparent !important;
        }
        .glass-card-header {
            background: rgba(15, 23, 42, 0.85) !important;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 1.25rem 1.5rem;
            border: 1px solid rgba(245, 158, 11, 0.35);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <main class="main-content">
            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4 glass-card-header animate-fade-in-up delay-header">
                <div>
                    <h2 class="fw-bold text-white mb-1"><i class="bi bi-people-fill text-warning me-2"></i>My Student Records</h2>
                    <p class="text-white opacity-75 mb-0">
                        Managing Student Records for Officer: <span class="badge bg-warning text-dark fw-bold" th:text="${currentAdmin != null ? currentAdmin.username : 'admin1'}">admin1</span>
                    </p>
                </div>
                <div>
                    <a href="/admin/students/new" class="btn btn-warning rounded-pill fw-bold shadow-sm border-0 px-4 text-dark">
                        <i class="bi bi-plus-lg me-1"></i> Add New Student
                    </a>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i><span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- SEARCH & FILTER BAR WITH STANDARDIZED DEPARTMENTS -->
            <div class="card border-0 shadow-lg rounded-4 mb-4 animate-fade-in-up delay-1">
                <div class="card-body p-3">
                    <form th:action="@{/admin/students}" method="get" class="row g-3 align-items-center">
                        <div class="col-md-5">
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                                <input type="text" name="query" th:value="${query}" class="form-control" placeholder="Search by Name, Reg No, or Department...">
                            </div>
                        </div>

                        <div class="col-md-3">
                            <select name="dept" class="form-select fw-semibold">
                                <option value="">-- All Departments --</option>
                                <option value="CSE" th:selected="${dept == 'CSE'}">CSE</option>
                                <option value="IT" th:selected="${dept == 'IT'}">IT</option>
                                <option value="AIDS" th:selected="${dept == 'AIDS'}">AIDS</option>
                                <option value="ECE" th:selected="${dept == 'ECE'}">ECE</option>
                                <option value="EEE" th:selected="${dept == 'EEE'}">EEE</option>
                                <option value="MECH" th:selected="${dept == 'MECH'}">MECH</option>
                                <option value="CIVIL" th:selected="${dept == 'CIVIL'}">CIVIL</option>
                            </select>
                        </div>

                        <div class="col-md-2">
                            <input type="number" step="0.1" min="6.5" max="10.0" name="minCgpa" th:value="${minCgpa}" class="form-control" placeholder="Min CGPA (6.5 - 10.0)">
                        </div>

                        <div class="col-md-2 d-flex gap-2">
                            <button type="submit" class="btn btn-primary w-100 fw-bold brand-gradient border-0">Filter</button>
                            <a href="/admin/students" class="btn btn-outline-secondary" title="Reset Filters"><i class="bi bi-arrow-counterclockwise"></i></a>
                        </div>
                    </form>
                </div>
            </div>

            <!-- PRIVACY SCOPED STUDENTS TABLE -->
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden animate-fade-in-up delay-2">
                <div class="table-responsive">
                    <table class="table table-hover table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Reg No</th>
                                <th>Name</th>
                                <th>Department</th>
                                <th>CGPA</th>
                                <th>Arrears</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="s : ${students}">
                                <td class="fw-bold text-primary" th:text="${s.registrationNumber}">REG001</td>
                                <td class="fw-semibold text-dark" th:text="${s.name}">Student Name</td>
                                <td><span class="badge bg-primary-subtle text-primary border border-primary-subtle fw-bold" th:text="${s.department}">CSE</span></td>
                                <td><span class="badge bg-success fs-6" th:text="${s.cgpa}">8.5</span></td>
                                <td>
                                    <span th:class="${s.arrears == 0 ? 'badge bg-secondary fs-6' : 'badge bg-danger fs-6'}" th:text="${s.arrears}">0</span>
                                </td>
                                <td>
                                    <div class="btn-group btn-group-sm" role="group">
                                        <a th:href="@{'/admin/students/' + ${s.id}}" class="btn btn-outline-info" title="View Details">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{'/admin/students/' + ${s.id} + '/edit'}" class="btn btn-outline-warning" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:action="@{'/admin/students/' + ${s.id} + '/delete'}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this student record?');">
                                            <button type="submit" class="btn btn-outline-danger" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(students)}">
                                <td colspan="6" class="text-center py-4 text-muted">No student records found matching the criteria.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

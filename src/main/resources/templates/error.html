<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PlacePro - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center p-5 bg-white rounded-4 shadow" style="max-width: 550px;">
        <i class="bi bi-exclamation-octagon-fill text-warning display-1 mb-3"></i>
        <h2 class="fw-bold text-dark mb-2">Something Went Wrong</h2>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected application error occurred. Please try again later.'}">Error description</p>
        <a href="/" class="btn btn-primary rounded-pill px-4 brand-gradient border-0">
            <i class="bi bi-arrow-left me-1"></i> Back to Home
        </a>
    </div>
</body>
</html>

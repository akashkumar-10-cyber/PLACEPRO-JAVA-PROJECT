<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Placepro - Faculty Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            position: relative;
            background-color: #e2e8f0;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('/images/app-bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            transform: translateZ(0);
            will-change: transform;
        }
        .main-content {
            background: rgba(255, 255, 255, 0.1) !important;
        }
        .glass-dashboard-header {
            background: rgba(255, 255, 255, 0.88) !important;
            backdrop-filter: blur(8px);
            border-radius: 18px;
            padding: 1.25rem 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
        }
        .status-badge-link {
            text-decoration: none;
            transition: transform 0.15s ease;
            display: inline-block;
        }
        .status-badge-link:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4 glass-dashboard-header animate-fade-in-up">
                <div>
                    <h2 class="fw-bold mb-1">
                        <i class="bi bi-speedometer2 text-primary me-2"></i>Placement Cell Officer Dashboard
                    </h2>
                    <p class="text-muted mb-0">
                        Managing Student Records for Officer: <span class="badge bg-primary fs-6 shadow-sm" th:text="${currentAdmin != null ? currentAdmin.username : 'admin1'}">admin1</span>
                    </p>
                </div>
                <div>
                    <a href="/admin/ai-recommendations" class="btn btn-warning shadow-sm rounded-pill fw-bold px-4 py-2">
                        <i class="bi bi-cpu-fill me-1"></i> AI Recommendation Portal
                    </a>
                </div>
            </div>

            <!-- STAT CARDS WITH ENTRANCE ANIMATIONS -->
            <div class="row g-3 mb-4">
                <!-- My Officer Students -->
                <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 animate-fade-in-up delay-1">
                    <a th:href="@{'/admin/students'}" class="card-stat-link" title="Click to view My Officer Students">
                        <div class="card card-stat p-3 border-start border-4 border-primary">
                            <div class="d-flex align-items-center">
                                <div class="icon-box bg-primary text-white me-3"><i class="bi bi-person-badge-fill"></i></div>
                                <div>
                                    <div class="card-stat-title">My Officer Students</div>
                                    <div class="card-stat-value text-primary" th:text="${myStudentsCount}">0</div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- Company Drives -->
                <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 animate-fade-in-up delay-2">
                    <a href="/admin/companies" class="card-stat-link" title="Click to view Company Drives">
                        <div class="card card-stat p-3 border-start border-4 border-info">
                            <div class="d-flex align-items-center">
                                <div class="icon-box bg-info text-white me-3"><i class="bi bi-building"></i></div>
                                <div>
                                    <div class="card-stat-title">Company Drives</div>
                                    <div class="card-stat-value text-dark" th:text="${totalCompanies}">0</div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- Active Drives -->
                <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 animate-fade-in-up delay-3">
                    <a href="/admin/placement-drives" class="card-stat-link" title="Click to view Active Drives">
                        <div class="card card-stat p-3 border-start border-4 border-warning">
                            <div class="d-flex align-items-center">
                                <div class="icon-box bg-warning text-dark me-3"><i class="bi bi-calendar-event"></i></div>
                                <div>
                                    <div class="card-stat-title">Active Drives</div>
                                    <div class="card-stat-value text-dark" th:text="${activeDrives}">0</div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- Applications -->
                <div class="col-xl-3 col-lg-3 col-md-6 col-sm-6 animate-fade-in-up delay-4">
                    <a href="/admin/applications" class="card-stat-link" title="Click to view Total Applications">
                        <div class="card card-stat p-3 border-start border-4 border-success">
                            <div class="d-flex align-items-center">
                                <div class="icon-box bg-success text-white me-3"><i class="bi bi-file-earmark-text"></i></div>
                                <div>
                                    <div class="card-stat-title">Total Applications</div>
                                    <div class="card-stat-value text-dark" th:text="${totalApplications}">0</div>
                                </div>
                            </div>
                        </div>
                    </a>
                </div>
            </div>

            <!-- CENTERED INTERACTIVE APPLICATION STATUS BREAKDOWN -->
            <div class="row g-4 mb-4 animate-fade-in-up delay-4">
                <div class="col-lg-8 col-md-10 mx-auto">
                    <div class="card p-4 shadow-lg rounded-4 border-0">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="fw-bold mb-0"><i class="bi bi-pie-chart-fill text-success me-2"></i>Placement Application Status</h5>
                        </div>
                        <div class="chart-container mb-3" style="position: relative; height: 280px;">
                            <canvas id="statusChart"></canvas>
                        </div>

                        <!-- CLICKABLE STATUS BADGES FOR FAST NAVIGATION -->
                        <div class="d-flex flex-wrap gap-2 justify-content-center pt-3 border-top">
                            <a href="/admin/applications?status=PLACED" class="status-badge-link">
                                <span class="badge bg-success px-3 py-2 fs-6 shadow-sm"><i class="bi bi-trophy-fill me-1"></i> Placed</span>
                            </a>
                            <a href="/admin/applications?status=SHORTLISTED" class="status-badge-link">
                                <span class="badge bg-warning text-dark px-3 py-2 fs-6 shadow-sm"><i class="bi bi-star-fill me-1"></i> Shortlisted</span>
                            </a>
                            <a href="/admin/applications?status=INTERVIEW" class="status-badge-link">
                                <span class="badge bg-purple text-white px-3 py-2 fs-6 shadow-sm" style="background-color: #8b5cf6;"><i class="bi bi-people-fill me-1"></i> Interview</span>
                            </a>
                            <a href="/admin/applications?status=APPLIED" class="status-badge-link">
                                <span class="badge bg-info text-dark px-3 py-2 fs-6 shadow-sm"><i class="bi bi-send-fill me-1"></i> Applied</span>
                            </a>
                            <a href="/admin/applications?status=REJECTED" class="status-badge-link">
                                <span class="badge bg-danger px-3 py-2 fs-6 shadow-sm"><i class="bi bi-x-circle-fill me-1"></i> Rejected</span>
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- CHARTS INITIALIZATION -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const statusData = /*[[${statusWiseApplications}]]*/ {};

        // Status Doughnut Chart (Clickable Slices)
        const statusCtx = document.getElementById('statusChart').getContext('2d');
        new Chart(statusCtx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(statusData),
                datasets: [{
                    data: Object.values(statusData),
                    backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6', '#3b82f6', '#ef4444'],
                    borderWidth: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'right' } },
                onClick: (event, elements) => {
                    if (elements.length > 0) {
                        const index = elements[0].index;
                        const statusLabel = Object.keys(statusData)[index];
                        if (statusLabel) {
                            window.location.href = '/admin/applications?status=' + encodeURIComponent(statusLabel);
                        }
                    }
                }
            }
        });
        /*]]>*/
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

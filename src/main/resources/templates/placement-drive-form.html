<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit ? 'Edit Placement Drive' : 'Create Placement Drive'}">Placement Drive Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="main-content">
            <div class="mb-4">
                <a href="/admin/placement-drives" class="btn btn-outline-secondary btn-sm rounded-pill mb-2"><i class="bi bi-arrow-left"></i> Back to Drives</a>
                <h2 class="fw-bold mb-1" th:text="${isEdit ? 'Edit Placement Drive' : 'Create Placement Drive'}">Drive Form</h2>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <form th:action="${isEdit ? '/admin/placement-drives/' + drive.id : '/admin/placement-drives'}" method="post">

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Select Company *</label>
                                <select name="companyId" class="form-select" required>
                                    <option value="">-- Choose Company --</option>
                                    <option th:each="c : ${companies}"
                                            th:value="${c.id}"
                                            th:text="${c.name + ' (' + c.industry + ')'}"
                                            th:selected="${isEdit and drive.company.id == c.id}">Company</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Job Role Title *</label>
                                <input type="text" name="jobRole" th:value="${isEdit ? drive.jobRole : ''}" class="form-control" placeholder="e.g. Software Engineer (SDE-1)" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Drive Date *</label>
                                <input type="date" name="driveDate" th:value="${isEdit ? drive.driveDate : ''}" class="form-control" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Application Deadline *</label>
                                <input type="date" name="applicationDeadline" th:value="${isEdit ? drive.applicationDeadline : ''}" class="form-control" required>
                            </div>

                            <div class="col-md-12">
                                <label class="form-label fw-semibold">Eligibility Rules Description</label>
                                <textarea name="eligibilityDescription" th:text="${isEdit ? drive.eligibilityDescription : ''}" class="form-control" rows="3" placeholder="e.g. Min 7.5 CGPA, Max 0 arrears, B.Tech CSE/IT/ECE students only."></textarea>
                            </div>

                            <div class="col-md-6" th:if="${isEdit}">
                                <label class="form-label fw-semibold">Drive Status</label>
                                <select name="status" class="form-select">
                                    <option value="OPEN" th:selected="${drive.status == 'OPEN'}">OPEN</option>
                                    <option value="CLOSED" th:selected="${drive.status == 'CLOSED'}">CLOSED</option>
                                    <option value="COMPLETED" th:selected="${drive.status == 'COMPLETED'}">COMPLETED</option>
                                </select>
                            </div>

                            <div class="col-md-12 mt-4">
                                <button type="submit" class="btn btn-primary px-4 rounded-pill fw-bold brand-gradient border-0">
                                    <i class="bi bi-save me-1"></i> Save Drive
                                </button>
                                <a href="/admin/placement-drives" class="btn btn-outline-secondary px-4 rounded-pill ms-2">Cancel</a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

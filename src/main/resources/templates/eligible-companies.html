<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PlacePro - Companies Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="app-container">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>

        <main class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1"><i class="bi bi-building-check text-info me-2"></i>Recruiting Companies Directory</h2>
                    <p class="text-muted mb-0">Browse company profiles, skill expectations, and salary packages.</p>
                </div>
            </div>

            <div class="row g-4">
                <div th:each="c : ${companies}" class="col-md-4">
                    <div class="card border-0 shadow-sm rounded-4 h-100">
                        <div class="card-body p-4">
                            <span class="badge bg-light text-dark border mb-2" th:text="${c.industry}">Software</span>
                            <h4 class="fw-bold text-dark mb-1" th:text="${c.name}">Company Name</h4>
                            <small class="text-muted d-block mb-3" th:text="${c.location}">Location</small>

                            <div class="d-flex justify-content-between align-items-center p-2 bg-light rounded-3 mb-3">
                                <span class="small text-muted">Package</span>
                                <span class="fw-bold text-success fs-5" th:text="${'₹ ' + c.packageOffered + ' LPA'}">12 LPA</span>
                            </div>

                            <div class="mb-3">
                                <div class="small fw-bold text-muted mb-1">Required Skills:</div>
                                <p class="small text-secondary mb-0" th:text="${c.requiredSkills}">Java, SQL</p>
                            </div>

                            <div class="row g-2 small text-muted border-top pt-2">
                                <div class="col-6">Min CGPA: <strong class="text-dark" th:text="${c.minimumCgpa}">7.5</strong></div>
                                <div class="col-6">Max Arrears: <strong class="text-dark" th:text="${c.maximumArrears}">0</strong></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

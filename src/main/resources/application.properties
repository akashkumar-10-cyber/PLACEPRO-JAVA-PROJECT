spring.application.name=placepro-ai

# Database Configuration (MySQL environment variables with H2 fallback for seamless execution)
spring.datasource.url=${DB_URL:jdbc:h2:mem:placepro;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Disable Thymeleaf Template Caching (Ensures instant HTML/CSS updates)
spring.thymeleaf.cache=false

# H2 Console (for debugging/development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# Server Port
server.port=8080

# Logging
logging.level.com.placepro=INFO
